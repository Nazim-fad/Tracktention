data:
  frames_root: /data/youtube_vis/frames
  tracks_root: /data/youtube_vis/tracks
  train_split: train
  valid_split: valid
  clip_len: 6
  image_size: 256
  train_stride: 2
  valid_stride: 8
  num_workers: 4

ddcolor:
  root: /path/to/DDColor
  checkpoint: null
  encoder_name: convnext-l
  encoder_from_pretrain: false
  nf: 512
  num_queries: 100
  num_scales: 3
  dec_layers: 9
  disc_nf: 64
  last_norm: Spectral

tracktention:
  stage_names:
    - encoder.arch.norm0
    - encoder.arch.norm1
    - encoder.arch.norm2
  feature_dims: [192, 384, 768]
  num_heads: [8, 8, 8]
  num_layers: 2
  sigma: 0.5
  freeze_backbone: false

optim:
  batch_size: 1
  lr_g: 1.6e-5
  lr_d: 1.6e-5
  weight_decay_g: 0.01
  weight_decay_d: 0.0
  total_iters: 40000
  eval_every: 2000
  save_every: 2000
  use_amp: false

system:
  device: cuda
  seed: 0
  output_dir: /outputs/run1
  resume: null